# XcodeGen spec: `xcodegen generate` writes PennyLane.xcodeproj (gitignored)
# from this file. Anything set in the Xcode GUI is lost on the next generate,
# so signing lives in Config/Signing.xcconfig (gitignored, see .example).
name: PennyLane
options:
  bundleIdPrefix: com.alexhedtke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PennyLane:
    type: application
    platform: iOS
    sources:
      - path: PennyLane/Sources
      - path: PennyLane/Resources
    info:
      path: PennyLane/Info.plist
      properties:
        CFBundleDisplayName: Penny Lane
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # The Mac serves plain http on the LAN; the tunnel is https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Penny Lane talks to the server on your Mac over the local network.
        NSCameraUsageDescription: The camera scans product barcodes on the shelf and the pairing QR code from the Mac.
        CFBundleURLTypes:
          - CFBundleURLName: com.alexhedtke.pennylane
            CFBundleURLSchemes: [pennylane]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhedtke.pennylane
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
