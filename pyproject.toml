[project]
name = "penny-lane"
version = "0.1.0"
description = "Per-store clearance and penny-item detection for Home Depot, Lowe's, Dollar General and Walmart"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "curl_cffi>=0.10", "segno>=1.6", "pillow>=10"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["**/.venv", "ios", "web"]

[tool.ruff.lint]
# Same small, high-signal set the Exobrain harness uses.
select = ["F", "E4", "E7", "E9", "B", "SLF", "TID25"]
ignore = ["B008", "E401", "E701", "E702", "E731", "E741", "E402"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["**/.venv", "ios", "web"]
