<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f3">
<title>Penny Lane</title>
<link rel="stylesheet" href="/static/vendor/beer.min.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/icon.png">
</head>
<body class="light">
<header class="fixed">
  <nav>
    <h6 class="max"><span class="coin">¢</span>Penny Lane</h6>
    <span id="unseen" class="chip small primary hidden">0</span>
    <button id="scanBtn" class="circle transparent" title="Scan a barcode"><i>barcode_scanner</i></button>
    <button id="refreshBtn" class="circle transparent" title="Refresh"><i>refresh</i></button>
  </nav>
</header>

<main class="responsive">
  <section id="tab-home" class="tab">
    <div id="hero" class="hero"></div>
    <div id="alerts"></div>
    <h5>Closest to a penny</h5>
    <div class="row wrap" id="filters">
      <select id="fRetailer" class="field"><option value="">All retailers</option></select>
      <select id="fStore" class="field"><option value="">All stores</option></select>
      <select id="fStage" class="field">
        <option value="">Any stage</option><option value="penny">Penny</option><option value="imminent">Imminent</option>
        <option value="late">Late</option><option value="early">Early</option>
      </select>
      <select id="fSort" class="field">
        <option value="score">Sort: score</option><option value="msrp">Sort: MSRP</option>
        <option value="savings">Sort: savings</option><option value="recent">Sort: recent</option>
      </select>
    </div>
    <div id="ranked"></div>
  </section>

  <section id="tab-scan" class="tab hidden">
    <h5>Scan</h5>
    <p class="muted small-text">Type or scan a UPC, a Home Depot SKU from the yellow tag, or a Lowe's item number. On the phone, the camera fills this in.</p>
    <div class="row wrap">
      <input id="scanInput" class="field max" inputmode="numeric" placeholder="UPC / SKU / item number" autocomplete="off">
      <button id="scanGo" class="border primary-btn">Look up</button>
    </div>
    <div class="row wrap" style="margin-top:8px">
      <select id="scanRetailer" class="field"><option value="">Any retailer</option></select>
      <select id="scanStore" class="field"><option value="">All watched stores</option></select>
    </div>
    <div id="scanOut"></div>
  </section>

  <section id="tab-lists" class="tab hidden">
    <h5>Community lists</h5>
    <div class="row wrap">
      <select id="lRetailer" class="field"><option value="">All retailers</option></select>
      <select id="lSort" class="field">
        <option value="recent">Sort: recent</option><option value="retail">Sort: MSRP</option><option value="stocked">Sort: stocked near me</option>
      </select>
      <button id="runSources" class="border">Pull lists now</button>
      <button id="runVerify" class="border">Verify at my stores</button>
    </div>
    <div id="lists"></div>
  </section>

  <section id="tab-item" class="tab hidden"><div id="itemView"></div></section>

  <section id="tab-settings" class="tab hidden">
    <h5>Settings</h5>
    <div id="settings"></div>
  </section>
</main>

<nav class="bottom">
  <a data-tab="home"><i>home</i><div>Home</div></a>
  <a data-tab="scan"><i>barcode_scanner</i><div>Scan</div></a>
  <a data-tab="lists"><i>list_alt</i><div>Lists</div></a>
  <a data-tab="settings"><i>settings</i><div>Settings</div></a>
</nav>
<div id="snack" class="snackbar"></div>
<script type="module" src="/static/vendor/beer.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
